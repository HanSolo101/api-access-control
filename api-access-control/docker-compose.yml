services:
  db:
    image: postgres:15-alpine
    container_name: api_access_control_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-api_access_control}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api_access_control_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app1: &app_base
    build: .
    container_name: api_access_control_app1
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-api_access_control}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-super-secret-admin-token}
      PEPPER: ${PEPPER:-default-pepper}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    <<: *app_base
    container_name: api_access_control_app2

  app3:
    <<: *app_base
    container_name: api_access_control_app3

  nginx:
    image: nginx:alpine
    container_name: api_access_control_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  db_data:
    name: api_access_control_db_data
